<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <style>
      .app-bg { fill: #0a0f1d; }
      .hdr-bg { fill: #111827; stroke: #334155; stroke-width: 1; }
      .sidebar-bg { fill: #111827; stroke: #334155; stroke-width: 1; }
      .card-bg { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8; }
      .input-bg { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 4; }
      .brand-title { font-family: sans-serif; font-size: 17px; font-weight: 800; fill: #f8fafc; }
      .sec-hdr { font-family: sans-serif; font-size: 11px; font-weight: 700; fill: #10b981; text-transform: uppercase; letter-spacing: 0.5px; }
      .lbl-txt { font-family: sans-serif; font-size: 11px; font-weight: 600; fill: #94a3b8; }
      .val-txt { font-family: sans-serif; font-size: 12px; fill: #f8fafc; }
      .btn-green { fill: #10b981; rx: 6; }
      .btn-gray { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 6; }
      .btn-txt { font-family: sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <rect class="app-bg" width="1200" height="750" />

  <!-- App Header -->
  <rect class="hdr-bg" x="0" y="0" width="1200" height="60" />
  <rect fill="#10b981" x="20" y="14" width="34" height="34" rx="8" />
  <text font-family="sans-serif" font-size="18" font-weight="900" fill="#fff" x="30" y="37">✍</text>
  <text class="brand-title" x="68" y="36">SignShield Pro</text>
  <rect fill="rgba(16, 185, 129, 0.15)" x="210" y="20" width="55" height="20" rx="4" />
  <text font-family="sans-serif" font-size="11" font-weight="700" fill="#10b981" x="222" y="34">v1.0.0</text>

  <!-- Header Action Buttons -->
  <g transform="translate(680, 14)">
    <rect class="input-bg" x="0" y="0" width="190" height="32" />
    <text class="val-txt" x="12" y="21">Delaware MSA (Preset)</text>
    <rect class="btn-gray" x="200" y="0" width="90" height="32" />
    <text class="btn-txt" x="245" y="20">SVG Seal</text>
    <rect class="btn-green" x="300" y="0" width="190" height="32" />
    <text class="btn-txt" x="395" y="20">Print / Save Signed PDF</text>
  </g>

  <!-- Left Sidebar Controls -->
  <rect class="sidebar-bg" x="0" y="60" width="460" height="690" />
  <g transform="translate(20, 80)">
    <!-- Contract Meta Box -->
    <rect class="card-bg" x="0" y="0" width="420" height="135" />
    <text class="sec-hdr" x="15" y="24">Contract Identification</text>
    <text class="lbl-txt" x="15" y="48">Document Title</text>
    <rect class="input-bg" x="15" y="55" width="390" height="28" />
    <text class="val-txt" x="25" y="74">Master Software Engineering Agreement</text>
    <text class="lbl-txt" x="15" y="98">Governing Jurisdiction</text>
    <rect class="input-bg" x="15" y="105" width="390" height="22" />
    <text class="val-txt" x="25" y="121">State of Delaware, United States</text>

    <!-- Signatory Box -->
    <rect class="card-bg" x="0" y="150" width="420" height="440" />
    <text class="sec-hdr" x="15" y="174">Signatory Credentials &amp; Execution</text>

    <text class="lbl-txt" x="15" y="198">Signer Legal Name &amp; Email</text>
    <rect class="input-bg" x="15" y="205" width="190" height="28" />
    <text class="val-txt" x="25" y="224">Marcus Vance</text>
    <rect class="input-bg" x="215" y="205" width="190" height="28" />
    <text class="val-txt" x="225" y="224">m.vance@venturepeak.io</text>

    <text class="lbl-txt" x="15" y="248">Signature Canvas Pad (Live Drawing)</text>
    <rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1" x="15" y="255" width="390" height="110" rx="6" />
    <path d="M 40 320 Q 90 280 130 325 T 190 310 T 250 330" fill="none" stroke="#0f172a" stroke-width="2.5" />
    <text font-family="sans-serif" font-size="10" fill="#94a3b8" x="25" y="275">Touchpad / Stylus Capture Active</text>

    <text class="lbl-txt" x="15" y="380">Corporate Seal / Stamp Overlay</text>
    <rect class="input-bg" x="15" y="387" width="390" height="28" />
    <text class="val-txt" x="25" y="406">★ Approved &amp; Executed (Legal Seal)</text>

    <rect class="btn-gray" x="15" y="430" width="120" height="28" />
    <text class="btn-txt" x="75" y="448">Clear Signature</text>
  </g>

  <!-- Right Live Preview Workspace -->
  <g transform="translate(500, 80)">
    <!-- Document Preview Sheet -->
    <rect fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" width="670" height="620" rx="8" />

    <!-- Sheet Header -->
    <text font-family="-apple-system, serif" font-size="15" font-weight="800" fill="#0f172a" x="30" y="40">Master Software Engineering &amp; Design Agreement</text>
    <text font-family="sans-serif" font-size="10" fill="#64748b" x="30" y="58">Governing Jurisdiction: State of Delaware • Executed: 2026-09-29</text>
    <line x1="30" y1="70" x2="640" y2="70" stroke="#0f172a" stroke-width="1" />

    <!-- Parties Box -->
    <rect fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" x="30" y="85" width="610" height="45" rx="4" />
    <text font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a" x="40" y="105">Party A: Apex Digital Labs LLC</text>
    <text font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a" x="340" y="105">Party B: VenturePeak Holdings Inc.</text>

    <!-- Clauses Preview -->
    <text font-family="-apple-system, serif" font-size="10" fill="#334155" x="30" y="150">1. SCOPE OF SERVICES: Full-stack cloud engineering deliverables...</text>
    <text font-family="-apple-system, serif" font-size="10" fill="#334155" x="30" y="170">2. COMPENSATION: Payment due 14 days following invoice receipt...</text>
    <text font-family="-apple-system, serif" font-size="10" fill="#334155" x="30" y="190">3. IP ASSIGNMENT: Contractor assigns all work product upon final settlement...</text>

    <!-- Signature Boxes -->
    <rect fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1" x="30" y="220" width="295" height="90" rx="4" />
    <line x1="40" y1="285" x2="315" y2="285" stroke="#0f172a" stroke-width="1" />
    <text font-family="sans-serif" font-size="9" font-weight="700" fill="#475569" x="40" y="300">Authorized Signature • Apex Digital Labs</text>

    <rect fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1" x="345" y="220" width="295" height="90" rx="4" />
    <text font-family="cursive" font-style="italic" font-size="17" fill="#0f172a" x="360" y="260">Marcus Vance</text>
    <rect fill="rgba(5,150,105,0.06)" stroke="#059669" stroke-width="1" stroke-dasharray="2,2" x="500" y="235" width="130" height="20" rx="3" />
    <text font-family="sans-serif" font-size="8" font-weight="800" fill="#059669" x="565" y="249" text-anchor="middle">★ APPROVED ★</text>
    <line x1="355" y1="285" x2="630" y2="285" stroke="#0f172a" stroke-width="1" />
    <text font-family="sans-serif" font-size="9" font-weight="700" fill="#475569" x="355" y="300">Authorized Signature • Marcus Vance (CTO)</text>

    <!-- Attached Audit Certificate -->
    <rect fill="#ffffff" stroke="#243452" stroke-width="1.5" x="30" y="330" width="610" height="260" rx="6" />
    <text font-family="sans-serif" font-size="8" font-weight="800" fill="#2563eb" letter-spacing="0.5" x="45" y="355">SIGNSHIELD PRO CRYPTOGRAPHIC AUDIT SERVICE</text>
    <text font-family="sans-serif" font-size="12" font-weight="900" fill="#0f172a" x="45" y="375">Certificate of Completion &amp; Electronic Signature</text>
    <text font-family="monospace" font-size="9" font-weight="700" fill="#0f172a" x="520" y="375">SSP-68DA21F-A98B</text>

    <line x1="45" y1="388" x2="625" y2="388" stroke="#e2e8f0" stroke-width="1" />

    <text font-family="sans-serif" font-size="9" font-weight="700" fill="#64748b" x="45" y="410">Signatory:</text>
    <text font-family="sans-serif" font-size="9" fill="#0f172a" x="140" y="410">Marcus Vance &lt;m.vance@venturepeak.io&gt; • CTO</text>

    <text font-family="sans-serif" font-size="9" font-weight="700" fill="#64748b" x="45" y="430">Timestamp:</text>
    <text font-family="monospace" font-size="9" fill="#0f172a" x="140" y="430">2026-09-29T05:52:14Z (UTC)</text>

    <text font-family="sans-serif" font-size="9" font-weight="700" fill="#64748b" x="45" y="450">Content SHA-256:</text>
    <text font-family="monospace" font-size="8" fill="#2563eb" x="140" y="450">f336e84af426a8dfa19b45091a18204b77f98a2110c7329dbe0f8812c85e2b01</text>

    <text font-family="sans-serif" font-size="9" font-weight="700" fill="#64748b" x="45" y="470">Audit SHA-256:</text>
    <text font-family="monospace" font-size="8" fill="#059669" font-weight="700" x="140" y="470">7ca918bb129fa900f074a106e4cc5f8d0521e1a8bb3dfa20993040c5f782390a</text>

    <rect fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" x="45" y="500" width="580" height="30" rx="4" />
    <circle cx="65" cy="515" r="5" fill="#059669" />
    <text font-family="sans-serif" font-size="9" font-weight="800" fill="#059669" x="78" y="519">STATUS: TAMPER-PROOF &amp; CRYPTOGRAPHICALLY SEALED</text>
  </g>
</svg>
